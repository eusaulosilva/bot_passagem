name: Monitorar Passagens de Ônibus

on:
  schedule:
    # Executa a cada 10 minutos (24 horas por dia)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  monitorar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium do Playwright
        run: playwright install --with-deps chromium

      - name: Restaurar estado anterior (evitar alertas repetidos)
        uses: actions/cache/restore@v4
        with:
          path: estado_monitoramento.json
          key: estado-monitoramento-${{ github.run_id }}
          restore-keys: |
            estado-monitoramento-

      - name: Executar monitoramento
        env:
          URL_GUANABARA: ${{ secrets.URL_GUANABARA }}
          URL_CLICKBUS: ${{ secrets.URL_CLICKBUS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO_LOOP_LOCAL: 'false'
          NOTIFICAR_SEMPRE: 'false'
        run: python bot.py

      - name: Salvar estado atualizado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado_monitoramento.json
          key: estado-monitoramento-${{ github.run_id }}
