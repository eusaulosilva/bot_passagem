name: Monitorar Passagens de Ônibus

on:
  schedule:
    # Executa a cada 5 minutos em minutos fora do pico (:02, :07, :12, ...)
    # para reduzir atrasos na fila do agendador do GitHub Actions
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      forcar_alerta:
        description: 'Forçar envio de alerta no Telegram (ignorar anti-spam)'
        type: boolean
        default: false

concurrency:
  group: monitorar-passagens
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium do Playwright
        run: playwright install --with-deps chromium

      - name: Restaurar estado anterior (evitar alertas repetidos)
        uses: actions/cache/restore@v4
        with:
          path: estado_monitoramento.json
          key: estado-monitoramento-${{ github.run_id }}
          restore-keys: |
            estado-monitoramento-

      - name: Executar monitoramento
        env:
          URL_GUANABARA: ${{ secrets.URL_GUANABARA }}
          URL_CLICKBUS: ${{ secrets.URL_CLICKBUS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO_LOOP_LOCAL: 'false'
          NOTIFICAR_SEMPRE: ${{ inputs.forcar_alerta == true && 'true' || 'false' }}
          TZ: 'America/Sao_Paulo'
        run: python bot.py

      - name: Salvar estado atualizado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado_monitoramento.json
          key: estado-monitoramento-${{ github.run_id }}
